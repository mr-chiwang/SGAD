# @package _global_
defaults:
 - /dataset: scannet_sam
 - /areagraph: scannet
 - /point_matcher: loftr_indoor
 - /area_matcher: sgad
 - /geo_area_matcher: egam
 - /evaler: instance_eval
 - _self_

name: sgad-egam-loftr-sn-1296
dataset_name: ScanNet
test_area_acc: 0
test_pose_err: 1
test_pm_acc: 0

pair_file_path: ${oc.env:A2PM_SGAD_ROOT,${hydra:runtime.cwd}}/assets/pairs/scannet1500_pairs.txt
max_pairs: 1500
skip_done: false
deterministic_eval_seed: 66


area_from_size_W: 640
area_from_size_H: 480

eval_from_size_W: 640
eval_from_size_H: 480

crop_from_size_W: 1296
crop_from_size_H: 968

crop_size_W: 1296
crop_size_H: 968

area_crop_size_W: 640
area_crop_size_H: 480

verbose: 0
out_path: ${oc.env:A2PM_SGAD_ROOT,${hydra:runtime.cwd}}/res/${name}-res
match_num: 1000

evaler:
  eval_corr_num: ${match_num}
  sample_mode: grid
  sac_mode: MAGSAC
  out_path: ${out_path}

point_matcher:
  dataset_name: ${dataset_name}

geo_area_matcher:
  datasetName: ${dataset_name}
  alpha_list: [3200]
  crop_mode: 0
  std_match_num: ${match_num}
  valid_inside_area_match_num: 100
  min_area_matches_for_geom: 50
  min_inliers_for_geom: 10
  crop_size_W: ${crop_size_W}
  crop_size_H: ${crop_size_H}
  area_crop_size_W: ${area_crop_size_W}
  area_crop_size_H: ${area_crop_size_H}
  crop_from_size_W: ${crop_from_size_W}
  crop_from_size_H: ${crop_from_size_H}
  eval_from_size_W: ${eval_from_size_W}
  eval_from_size_H: ${eval_from_size_H}
  area_from_size_W: ${area_from_size_W}
  area_from_size_H: ${area_from_size_H}
  reject_out_area_flag: 0
  verbose: ${verbose}

area_matcher:
  datasetName: ${dataset_name}
  W: ${area_from_size_W}
  H: ${area_from_size_H}
  draw_verbose: ${verbose}
  weights: ${oc.env:A2PM_SGAD_WEIGHTS,"${oc.env:A2PM_SGAD_ROOT,${hydra:runtime.cwd}}/sgad/logs/tb_logs/scannet-scannet_sgad_fixed_pos_scale-bs=512/version_3/checkpoints/epoch=41-HMQR_avg_val(all)=0.451.ckpt"}
  hcrf: true
  hcrf_overlap_threshold: 0.99
  hcrf_coverage_threshold: 0.8
